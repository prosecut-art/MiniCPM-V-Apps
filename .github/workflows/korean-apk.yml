name: Build Korean APK v3

# 휴대폰용 MiniCPM-V 앱에 한국어를 넣어서 APK로 만드는 자동 빌드입니다. (v3)
# 이 파일을 저장하면 자동으로 시작됩니다.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/korean-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: NDK, CMake 설치
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=SDK 설치 실패::${LINENO}번째 줄에서 실패 (ANDROID_HOME=${ANDROID_HOME:-없음})"' ERR
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "미리 설치된 cmdline-tools가 없어 직접 내려받습니다"
            sudo mkdir -p "$SDK/cmdline-tools"
            sudo chown -R "$(id -u):$(id -g)" "$SDK"
            curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
            mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          if [ ! -w "$SDK" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK"
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;27.0.12077973" "cmake;4.1.2"
          "$SDKM" --sdk_root="$SDK" "platforms;android-36.1" || echo "플랫폼은 Gradle이 자동으로 받습니다"
          [ -d "$SDK/ndk/27.0.12077973" ] || { echo "::error title=NDK 없음::ndk;27.0.12077973 설치 실패"; exit 1; }
          [ -x "$SDK/cmake/4.1.2/bin/cmake" ] || { echo "::error title=CMake 없음::cmake;4.1.2 설치 실패"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 한국어 적용
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=한국어 적용 실패::${LINENO}번째 줄에서 실패"' ERR
          A=MiniCPM-V-demo-Android
          R=$A/app/src/main/res
          L=$A/app/src/main/java/com/example/minicpm_v_demo/LocaleManager.kt

          # 1) 한국어 문구 파일 만들기
          mkdir -p "$R/values-ko"
          cat > "$R/values-ko/strings.xml" <<'KO_STRINGS_EOF'
          <resources>
              <!-- 한국어 번역. 여기에 없는 키는 values/strings.xml(중국어 기본값)을 따릅니다.
                   브랜드 이름(app_name, app_title, welcome_title 등), 영어 고정 프롬프트
                   (suggestion_2, suggestion_2_text, disclaimer)는 이미 영어이므로 의도적으로 뺐습니다. -->

              <string name="welcome_desc">학습과 영감, 업무 효율을 높일 수 있도록 도와드릴게요. 이미지도 이해해서 알려드려요.</string>
              <string name="welcome_desc_text">학습과 영감, 업무 효율을 높일 수 있도록 도와드릴게요. 무엇이든 물어보세요.</string>
              <string name="suggestion_1">이 사진에 무엇이 있나요?</string>
              <string name="suggestion_1_text">봄에 관한 시를 써 주세요.</string>
              <string name="model_management">모델 관리</string>
              <string name="status_uninitialized">초기화되지 않음 — 모델을 다운로드하거나 불러오세요</string>
              <string name="status_initializing">초기화 중…</string>
              <string name="status_initialized">초기화 완료 — 모델을 불러오세요</string>
              <string name="status_loading">모델 불러오는 중…</string>
              <string name="status_ready">모델 준비 완료</string>
              <string name="status_generating">답변 생성 중…</string>
              <string name="status_downloading">모델 다운로드 중…</string>
