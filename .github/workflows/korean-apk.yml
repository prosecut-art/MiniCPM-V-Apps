              <string name="tts_play_failed">재생 실패: %1$s</string>
              <string name="tts_record_permission_denied">참조 음성을 녹음하려면 마이크 권한이 필요합니다</string>
              <string name="tts_download_prompt_title">모델 파일 없음</string>
              <string name="tts_download_prompt_message">먼저 VoxCPM2 모델을 다운로드하세요</string>
              <string name="tts_model_load_failed">모델 불러오기 실패</string>
              <string name="tts_preset_load_failed">기본 음성 불러오기 실패: %1$s</string>
              <string name="tts_baselm_missing">BaseLM GGUF 파일이 없습니다. 다운로드하세요</string>
              <string name="tts_acoustic_missing">Acoustic GGUF 파일이 없습니다. 다운로드하세요</string>
          </resources>
          KO_STRINGS_EOF

          # 2) 언어 선택 창에 한국어 추가, 기본 언어를 한국어로
          sed -i 's|EN("en", "English");|EN("en", "English"),\n        KO("ko", "한국어");|' "$L"
          sed -i 's|?: AppLanguage.ZH|?: AppLanguage.KO|' "$L"
          grep -q 'KO("ko", "한국어");' "$L"
          grep -q '?: AppLanguage.KO' "$L"

          # 3) 기존 앱과 나란히 설치되도록 앱 ID와 이름 바꾸기
          sed -i 's|applicationId = "com.tianchi.minicpmv"|applicationId = "com.tianchi.minicpmv.ko"|' "$A/app/build.gradle.kts"
          grep -q 'applicationId = "com.tianchi.minicpmv.ko"' "$A/app/build.gradle.kts"
          sed -i 's|<string name="app_name">MiniCPM-V-demo</string>|<string name="app_name">MiniCPM 한국어</string>|' "$R/values/strings.xml"
          grep -q '<string name="app_name">MiniCPM 한국어</string>' "$R/values/strings.xml"

          # 4) 중국 미러 서버 설정 제거 (해외 서버에서는 구글/메이븐 공식 서버를 사용)
          sed -i '/maven.aliyun.com/d' "$A/settings.gradle.kts"

          # 5) 아이폰/맥에서만 되는 코드(F_NOCACHE) 때문에 안드로이드 빌드가 멈추는 문제 고치기
          M=llama.cpp-omni/src/llama-moe-slot.cpp
          cat > "$M.macro" <<'MOE_MACRO_EOF'
          #if defined(__APPLE__)
          #define MOE_FCNTL_NOCACHE(fd, on) (fcntl((fd), F_NOCACHE, (on)) != 0)
          #else
          #define MOE_FCNTL_NOCACHE(fd, on) ((void)(fd), (void)(on), false)
          #endif
          MOE_MACRO_EOF
          cat "$M.macro" "$M" > "$M.new"
          mv "$M.new" "$M"
          rm -f "$M.macro"
          sed -i 's|fcntl(kv.second, F_NOCACHE, on ? 1 : 0) != 0|MOE_FCNTL_NOCACHE(kv.second, on ? 1 : 0)|' "$M"
          sed -i 's|fcntl(fd, F_NOCACHE, 1) != 0|MOE_FCNTL_NOCACHE(fd, 1)|' "$M"
          grep -q 'MOE_FCNTL_NOCACHE(kv.second, on ? 1 : 0)' "$M"
          grep -q 'MOE_FCNTL_NOCACHE(fd, 1)' "$M"
          if grep -q 'fcntl([a-z.]*, F_NOCACHE' "$M"; then
            echo "::error title=한국어 적용 실패::F_NOCACHE 호출이 남아 있습니다"
            exit 1
          fi

      - name: APK 빌드
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          RC=$?
          set -e
          tail -n 80 "$RUNNER_TEMP/gradle.log"
          if [ "$RC" -ne 0 ]; then
            MSG=$(grep -E -A4 "What went wrong|FAILURE:|error:|Execution failed" "$RUNNER_TEMP/gradle.log" | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle 빌드 실패 (종료 코드 $RC)::$MSG"
            exit "$RC"
          fi

      - name: 빌드 기록 남기기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          L="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$L" ]; then
            echo "빌드 기록이 없어 건너뜁니다"
            exit 0
          fi
          D="$RUNNER_TEMP/logpub"
          rm -rf "$D"
          mkdir -p "$D"
          {
            echo "run_number=${{ github.run_number }}"
            echo "commit=${{ github.sha }}"
            date -u +"time=%Y-%m-%dT%H:%M:%SZ"
            echo "log_lines=$(wc -l < "$L")"
          } > "$D/info.txt"
          tail -n 300 "$L" > "$D/tail.txt"
          {
            grep -E ' error: |undefined reference|ninja: build stopped|FAILED:|What went wrong' "$L" | sort -u | head -n 60
            echo "=========== 앞뒤 내용 ==========="
            grep -n -E -B2 -A8 ' error: |undefined reference|FAILED:|What went wrong' "$L" | head -n 600
          } > "$D/errors.txt"
          cd "$D"
          git init -q
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -q -b build-logs
          git add .
          git commit -q -m "build log #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs
          echo "기록 올리기 결과 코드: $?"
          exit 0

      - name: 파일 이름 정리
        run: cp MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk MiniCPM-V-korean.apk

      - name: 결과물 보관
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-korean-apk
          path: MiniCPM-V-korean.apk

      - name: 다운로드 페이지(Releases)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG="korean-$(date -u +%Y%m%d-%H%M%S)"
          OUT=$(gh release create "$TAG" MiniCPM-V-korean.apk \
            --repo "${{ github.repository }}" \
            --title "한국어 APK ($TAG)" \
            --notes "한국어가 추가된 MiniCPM-V 앱입니다. MiniCPM-V-korean.apk 를 받아서 설치하세요." 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error title=릴리스 업로드 실패::$(echo "$OUT" | head -n 10 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$RC"
          fi
